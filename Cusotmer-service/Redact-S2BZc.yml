kind: Redact
apiVersion: api.ibm.com/v1
metadata:
  name: Redact-S2BZc
  namespace: customer-authentication
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
spec:
  message:
    messageName: response
    body:
      captures:
        jsonata:
          - $.aadhaar
          - $.pan
          - $.email
          - $.mobileNumber
          - customers.mobileNumber
          - customers.email
          - customers.pan
          - customers.aadhaar
