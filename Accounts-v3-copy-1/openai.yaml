kind: LLMProvider
apiVersion: api.ibm.com/v1
metadata:
  name: openai
  namespace: Accounts-v3
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
  domain: ai-platform
spec:
  provider:
    type: openai
    operations:
      - InvokeOpenAiChatCompletions
      - InvokeOpenAiEmbeddings
      - InvokeOpenAiModelsId
      - InvokeOpenAiModels
    apiKeySecret: openai-api-key
    tlsClientProfile: sample-tls-client-profile:1.0.0
    inputMessage: request
    cachePolicy:
      cache:
        expire:
          static:
            seconds: 60
        scope:
          narrowScope: {}
        ignoreControlDirectives: true
    projectId: proj_8JMF7sdaFR7JZ59Tr7IhDYjk
  product:
    $ref: Accounts-v3:product-openai-fvk1n:1.0
