openapi: 3.0.3
info:
  title: Customer API
  description: Enterprise Banking Customer API. Authoritative source for customer
    profiles, KYC verification, and account linkage.
  version: 1.0.0
  contact:
    name: Banking API Platform Team
    email: api-platform@bank.com
    url: https://developer.bank.com
  license:
    name: Internal Use Only
x-ibm-name: customer-api
x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  type: rest
  cors:
    enabled: true
  gateway: datapower-api-gateway
  buffering: true
  properties:
    - name: target-url
      value: https://customer-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud
      description: Base URL of the Customer microservice backend.
      encoded: false
  activity-log:
    enabled: true
    content: activity
    error-content: payload
  assembly:
    execute:
      - invoke:
          version: 2.0.0
          title: Invoke Customer Backend
          target-url: $(target-url)$(request.path)
          verb: keep
          timeout: 60
          follow-redirects: false
          compression: false
          inject-proxy-headers: true
          stop-on-error:
            - ConnectionError
            - OperationError
    catch:
      - errors:
          - ConnectionError
        execute:
          - set-variable:
              version: 2.0.0
              title: Set 503 Response
              actions:
                - set: message.status.code
                  value: 503
                  type: number
                - set: message.body
                  value: '{"code":503,"message":"Service temporarily unavailable."}'
                  type: string
      - errors:
          - OperationError
        execute:
          - set-variable:
              version: 2.0.0
              title: Set 502 Response
              actions:
                - set: message.status.code
                  value: 502
                  type: number
                - set: message.body
                  value: '{"code":502,"message":"Bad gateway. Upstream returned an invalid
                    response."}'
                  type: string
servers:
  - url: https://customer-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud/customers
    description: Production
tags:
  - name: Customers
    description: Customer profile lifecycle management.
  - name: KYC
    description: Know Your Customer identity verification.
paths:
  /customers:
    get:
      tags:
        - Customers
      summary: List customers
      description: Returns a paginated list of all active customers.
      operationId: listCustomers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          description: Filter by customer status.
          required: false
          schema:
            $ref: "#/components/schemas/CustomerStatus"
      responses:
        "200":
          description: Paginated list of customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
              examples:
                CustomerPageExample:
                  $ref: "#/components/examples/CustomerPageExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    post:
      tags:
        - Customers
      summary: Create customer
      description: Onboards a new customer and returns the assigned customer record.
      operationId: createCustomer
      requestBody:
        $ref: "#/components/requestBodies/CustomerCreateRequest"
      responses:
        "201":
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              examples:
                CustomerResponseExample:
                  $ref: "#/components/examples/CustomerResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  /customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    get:
      tags:
        - Customers
      summary: Get customer
      description: Returns the full profile for a single customer.
      operationId: getCustomer
      responses:
        "200":
          description: Customer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              examples:
                CustomerResponseExample:
                  $ref: "#/components/examples/CustomerResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    put:
      tags:
        - Customers
      summary: Update customer
      description: Replaces mutable profile fields for an existing customer.
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
      responses:
        "200":
          description: Updated customer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Customers
      summary: Delete customer
      description: Soft-deletes (deactivates) a customer record.
      operationId: deleteCustomer
      responses:
        "204":
          description: Customer deactivated. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  /customers/{customerId}/kyc:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    get:
      tags:
        - KYC
      summary: Get KYC record
      description: Returns the current KYC verification record for a customer.
      operationId: getKyc
      responses:
        "200":
          description: KYC record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycRecord"
              examples:
                KycRecordExample:
                  $ref: "#/components/examples/KycRecordExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    put:
      tags:
        - KYC
      summary: Update KYC status
      description: Updates the KYC verification status for a customer.
      operationId: updateKycStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycStatusUpdateRequest"
      responses:
        "200":
          description: Updated KYC record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by the bank identity provider.
  parameters:
    CustomerIdParam:
      name: customerId
      in: path
      required: true
      description: Unique customer identifier (CIF).
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      example: CUST-00123
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  requestBodies:
    CustomerCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerCreateRequest"
          examples:
            IndividualExample:
              $ref: "#/components/examples/CustomerCreateIndividualExample"
            CorporateExample:
              $ref: "#/components/examples/CustomerCreateCorporateExample"
  schemas:
    CustomerType:
      type: string
      enum:
        - INDIVIDUAL
        - CORPORATE
      description: Indicates whether the customer is a natural person or a legal entity.
    CustomerStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - SUSPENDED
        - PENDING_VERIFICATION
      description: Lifecycle status of the customer record.
    KycStatus:
      type: string
      enum:
        - NOT_STARTED
        - PENDING
        - VERIFIED
        - FAILED
        - EXPIRED
      description: KYC verification outcome.
    Address:
      type: object
      required:
        - line1
        - city
        - country
      properties:
        line1:
          type: string
          maxLength: 100
          description: Street address line 1.
          example: 123 Collins Street
        line2:
          type: string
          maxLength: 100
          description: Street address line 2 (optional).
          example: Suite 400
        city:
          type: string
          maxLength: 100
          description: City or suburb.
          example: Melbourne
        state:
          type: string
          maxLength: 100
          description: State or province.
          example: VIC
        postalCode:
          type: string
          maxLength: 20
          description: Postal or ZIP code.
          example: "3000"
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code.
          example: AU
    Customer:
      type: object
      required:
        - customerId
        - type
        - status
        - firstName
        - lastName
        - email
        - createdAt
      properties:
        customerId:
          type: string
          description: Unique customer identifier assigned by the system.
          example: CUST-00123
        type:
          $ref: "#/components/schemas/CustomerType"
        status:
          $ref: "#/components/schemas/CustomerStatus"
        firstName:
          type: string
          maxLength: 100
          description: Customer first name.
          example: Jane
        lastName:
          type: string
          maxLength: 100
          description: Customer last name.
          example: Smith
        email:
          type: string
          format: email
          description: Primary email address.
          example: jane.smith@example.com
        phone:
          type: string
          maxLength: 30
          description: Primary phone number in E.164 format.
          example: "+61412345678"
        dateOfBirth:
          type: string
          format: date
          description: Date of birth (ISO 8601). Required for INDIVIDUAL customers.
          example: 1985-06-15
        taxId:
          type: string
          maxLength: 50
          description: Tax identification number (TFN/ABN or equivalent).
          example: "123456789"
        address:
          $ref: "#/components/schemas/Address"
        kycStatus:
          $ref: "#/components/schemas/KycStatus"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created (UTC, ISO 8601).
          example: 2024-01-15T09:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the most recent update (UTC, ISO 8601).
          example: 2024-06-01T14:22:00Z
    CustomerCreateRequest:
      type: object
      required:
        - type
        - firstName
        - lastName
        - email
      properties:
        type:
          $ref: "#/components/schemas/CustomerType"
        firstName:
          type: string
          maxLength: 100
          description: Customer first name.
          example: Jane
        lastName:
          type: string
          maxLength: 100
          description: Customer last name.
          example: Smith
        email:
          type: string
          format: email
          description: Primary email address. Must be unique.
          example: jane.smith@example.com
        phone:
          type: string
          maxLength: 30
          description: Primary phone number in E.164 format.
          example: "+61412345678"
        dateOfBirth:
          type: string
          format: date
          description: Date of birth. Required when type is INDIVIDUAL.
          example: 1985-06-15
        taxId:
          type: string
          maxLength: 50
          description: Tax identification number.
          example: "123456789"
        address:
          $ref: "#/components/schemas/Address"
    CustomerUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
          description: Updated first name.
          example: Jane
        lastName:
          type: string
          maxLength: 100
          description: Updated last name.
          example: Smith
        email:
          type: string
          format: email
          description: Updated email address.
          example: jane.smith@example.com
        phone:
          type: string
          maxLength: 30
          description: Updated phone number.
          example: "+61412345678"
        address:
          $ref: "#/components/schemas/Address"
    CustomerPage:
      type: object
      required:
        - data
        - page
        - pageSize
        - totalCount
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
          description: Array of customer records for the current page.
        page:
          type: integer
          description: Current page number.
          example: 1
        pageSize:
          type: integer
          description: Records per page.
          example: 20
        totalCount:
          type: integer
          description: Total number of matching records across all pages.
          example: 142
    KycRecord:
      type: object
      required:
        - customerId
        - status
        - updatedAt
      properties:
        customerId:
          type: string
          description: Identifier of the associated customer.
          example: CUST-00123
        status:
          $ref: "#/components/schemas/KycStatus"
        verifiedAt:
          type: string
          format: date-time
          description: Timestamp when KYC was last verified (UTC, ISO 8601).
          example: 2024-05-20T10:00:00Z
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when the KYC verification expires (UTC, ISO 8601).
          example: 2026-05-20T10:00:00Z
        notes:
          type: string
          maxLength: 500
          description: Freetext notes from the compliance officer.
          example: All documents verified. No adverse findings.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last status update (UTC, ISO 8601).
          example: 2024-06-01T08:15:00Z
    KycStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/KycStatus"
        notes:
          type: string
          maxLength: 500
          description: Optional compliance notes for the status change.
          example: Identity documents reviewed and approved.
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: Human-readable error description.
          example: The request payload is invalid.
        details:
          type: array
          description: Field-level validation errors.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Name of the field that failed validation.
          example: email
        message:
          type: string
          description: Validation failure reason.
          example: Must be a valid email address.
  responses:
    BadRequest:
      description: Bad Request. The request payload is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 400
            message: The request payload is invalid.
            details:
              - field: email
                message: Must be a valid email address.
    Unauthorized:
      description: Unauthorized. A valid Bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 401
            message: Authentication token is missing or invalid.
    Forbidden:
      description: Forbidden. The caller does not have permission for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 403
            message: Insufficient scope for this operation.
    NotFound:
      description: Not Found. The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 404
            message: Customer not found.
    Conflict:
      description: Conflict. A customer with the same unique key already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 409
            message: A customer with this email address already exists.
    InternalServerError:
      description: Internal Server Error. An unexpected condition was encountered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 500
            message: An unexpected error occurred. Please try again later.
  examples:
    CustomerCreateIndividualExample:
      summary: Create an individual customer
      value:
        type: INDIVIDUAL
        firstName: Jane
        lastName: Smith
        email: jane.smith@example.com
        phone: "+61412345678"
        dateOfBirth: 1985-06-15
        taxId: "123456789"
        address:
          line1: 123 Collins Street
          city: Melbourne
          state: VIC
          postalCode: "3000"
          country: AU
    CustomerCreateCorporateExample:
      summary: Create a corporate customer
      value:
        type: CORPORATE
        firstName: Acme
        lastName: Corp Pty Ltd
        email: treasury@acmecorp.com.au
        phone: "+61396001234"
        taxId: "51824753556"
        address:
          line1: Level 10, 200 Queen Street
          city: Melbourne
          state: VIC
          postalCode: "3000"
          country: AU
    CustomerResponseExample:
      summary: Typical customer response
      value:
        customerId: CUST-00123
        type: INDIVIDUAL
        status: ACTIVE
        firstName: Jane
        lastName: Smith
        email: jane.smith@example.com
        phone: "+61412345678"
        dateOfBirth: 1985-06-15
        taxId: "123456789"
        address:
          line1: 123 Collins Street
          city: Melbourne
          state: VIC
          postalCode: "3000"
          country: AU
        kycStatus: VERIFIED
        createdAt: 2024-01-15T09:30:00Z
        updatedAt: 2024-06-01T14:22:00Z
    CustomerPageExample:
      summary: Paginated customer list
      value:
        data:
          - customerId: CUST-00123
            type: INDIVIDUAL
            status: ACTIVE
            firstName: Jane
            lastName: Smith
            email: jane.smith@example.com
            kycStatus: VERIFIED
            createdAt: 2024-01-15T09:30:00Z
            updatedAt: 2024-06-01T14:22:00Z
          - customerId: CUST-00124
            type: CORPORATE
            status: ACTIVE
            firstName: Acme
            lastName: Corp Pty Ltd
            email: treasury@acmecorp.com.au
            kycStatus: PENDING
            createdAt: 2024-02-10T11:00:00Z
            updatedAt: 2024-05-30T09:00:00Z
        page: 1
        pageSize: 20
        totalCount: 2
    KycRecordExample:
      summary: Verified KYC record
      value:
        customerId: CUST-00123
        status: VERIFIED
        verifiedAt: 2024-05-20T10:00:00Z
        expiresAt: 2026-05-20T10:00:00Z
        notes: All documents verified. No adverse findings.
        updatedAt: 2024-06-01T08:15:00Z
