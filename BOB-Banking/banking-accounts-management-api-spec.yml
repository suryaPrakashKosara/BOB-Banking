openapi: 3.0.3
info:
  title: Banking Accounts Management API
  description: Accounts Management API for the Agentic Banking Platform. Manages
    the full lifecycle of bank accounts including creation, balance enquiry,
    transactions, and closure. Every account belongs to an existing customer
    identified by customerId. Integrates with Customer API, Payments API, Loan
    API, and Risk API. All services use customerId as the common identifier.
  version: 1.0.0
  contact:
    name: Agentic Banking Platform Team
    email: banking-platform@example.com
  license:
    name: Internal Use Only
    url: https://www.example.com/license
servers:
  - url: https://accounts-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud
    description: Production Backend - IBM Code Engine au-syd
tags:
  - name: Accounts
    description: Account lifecycle management operations. Create, retrieve, update,
      and close bank accounts. Every account is linked to a customer via
      customerId.
  - name: Balance
    description: Account balance enquiry operations. Returns available balance,
      ledger balance, and currency for a given account number.
  - name: Transactions
    description: Account transaction operations. Supports Deposit, Withdrawal, and
      Transfer transactions. Returns full transaction history with pagination
      and date filters.
paths:
  /accounts:
    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Creates a new bank account for an existing customer. The
        accountNumber is auto-generated by the backend as a long numeric value
        starting from 1000000001. Every account must belong to a valid
        customerId between 1001 and 1020. Account types supported are SAVINGS,
        CURRENT, and FIXED_DEPOSIT. Default currency is INR. Default status is
        ACTIVE.
      operationId: createAccount
      requestBody:
        required: true
        description: Account creation payload. customerId, accountType, and branch are
          required. currency defaults to INR.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
            examples:
              SavingsAccountRequest:
                $ref: "#/components/examples/AccountCreateRequestSavingsExample"
              CurrentAccountRequest:
                $ref: "#/components/examples/AccountCreateRequestCurrentExample"
              FixedDepositRequest:
                $ref: "#/components/examples/AccountCreateRequestFDExample"
      responses:
        "201":
          description: Account created successfully. Returns the full account profile with
            auto-generated accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                CreatedAccount:
                  $ref: "#/components/examples/AccountResponseExample"
        "400":
          description: Validation failed. One or more required fields are missing or
            invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                ValidationFailed:
                  $ref: "#/components/examples/ValidationErrorExample"
        "409":
          description: Conflict. An active account of the same type already exists for
            this customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                DuplicateAccount:
                  $ref: "#/components/examples/ConflictErrorExample"
        "500":
          description: Internal server error. An unexpected condition was encountered on
            the backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
    get:
      tags:
        - Accounts
      summary: List all accounts
      description: Returns a paginated list of account summaries. Supports optional
        filters for customerId, accountType, and status. Use page and size for
        pagination. Default page is 0 and default size is 20.
      operationId: listAccounts
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number. Default is 0.
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Number of records per page. Default is 20. Maximum is 100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
        - name: customerId
          in: query
          required: false
          description: Filter accounts by customer ID. Must be a numeric value between
            1001 and 1020.
          schema:
            type: integer
            format: int64
            minimum: 1001
          example: 1001
        - name: accountType
          in: query
          required: false
          description: Filter accounts by account type. Allowed values are SAVINGS,
            CURRENT, FIXED_DEPOSIT.
          schema:
            type: string
            enum:
              - SAVINGS
              - CURRENT
              - FIXED_DEPOSIT
          example: SAVINGS
        - name: status
          in: query
          required: false
          description: Filter accounts by status. Allowed values are ACTIVE, INACTIVE,
            CLOSED.
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - CLOSED
          example: ACTIVE
      responses:
        "200":
          description: Paginated list of account summaries returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
              examples:
                AccountList:
                  $ref: "#/components/examples/AccountListResponseExample"
        "400":
          description: Invalid query parameter value supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequestErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
  /accounts/{accountNumber}:
    parameters:
      - name: accountNumber
        in: path
        required: true
        description: Unique numeric account number assigned by the system. Example is
          1000000001.
        schema:
          type: integer
          format: int64
          minimum: 1000000001
        example: 1000000001
    get:
      tags:
        - Accounts
      summary: Get account by account number
      description: Returns the complete account profile for the given accountNumber.
        This endpoint is consumed by Payments API to validate account before
        processing payments, Loan API to retrieve account details during loan
        application, and Risk API to assess account risk profile.
      operationId: getAccountByNumber
      responses:
        "200":
          description: Account details returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                AccountDetails:
                  $ref: "#/components/examples/AccountResponseExample"
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
    patch:
      tags:
        - Accounts
      summary: Update account details
      description: Updates mutable fields of an existing account. Allowed fields to
        update are nickname, status, and branch. Other fields are managed by the
        backend and cannot be updated via this endpoint.
      operationId: updateAccount
      requestBody:
        required: true
        description: Account update payload. All fields are optional. Provide only the
          fields to update.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
            examples:
              UpdateNickname:
                $ref: "#/components/examples/AccountUpdateRequestExample"
      responses:
        "200":
          description: Account updated successfully. Returns the updated account profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                UpdatedAccount:
                  $ref: "#/components/examples/AccountResponseExample"
        "400":
          description: Validation failed. One or more fields contain invalid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                ValidationFailed:
                  $ref: "#/components/examples/ValidationErrorExample"
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
    delete:
      tags:
        - Accounts
      summary: Close an account
      description: Performs a soft close of the account. The account record is not
        removed from the database. The backend sets the status to CLOSED. Once
        closed, no further deposits, withdrawals, or transfers can be performed
        on this account.
      operationId: closeAccount
      responses:
        "204":
          description: Account closed successfully. Status set to CLOSED. No content
            returned.
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
  /accounts/customer/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Unique numeric customer identifier. Must be between 1001 and 1020.
        schema:
          type: integer
          format: int64
          minimum: 1001
        example: 1001
    get:
      tags:
        - Accounts
      summary: Get all accounts for a customer
      description: Returns all bank accounts belonging to the given customerId. A
        customer may have multiple accounts of different types. This endpoint is
        consumed by Customer API, Loan API, and Risk API to retrieve the full
        account portfolio of a customer.
      operationId: getAccountsByCustomer
      responses:
        "200":
          description: List of accounts for the customer returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
              examples:
                CustomerAccounts:
                  $ref: "#/components/examples/CustomerAccountsResponseExample"
        "404":
          description: No customer found with the given customerId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/CustomerNotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
  /accounts/{accountNumber}/balance:
    parameters:
      - name: accountNumber
        in: path
        required: true
        description: Unique numeric account number. Example is 1000000001.
        schema:
          type: integer
          format: int64
          minimum: 1000000001
        example: 1000000001
    get:
      tags:
        - Balance
      summary: Get account balance
      description: Returns the current balance details for the given accountNumber.
        Returns available balance, ledger balance, currency, and last updated
        timestamp. Available balance is the amount available for withdrawal.
        Ledger balance is the total balance including pending transactions.
      operationId: getAccountBalance
      responses:
        "200":
          description: Account balance returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalanceResponse"
              examples:
                AccountBalance:
                  $ref: "#/components/examples/AccountBalanceResponseExample"
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
  /accounts/{accountNumber}/transactions:
    parameters:
      - name: accountNumber
        in: path
        required: true
        description: Unique numeric account number. Example is 1000000001.
        schema:
          type: integer
          format: int64
          minimum: 1000000001
        example: 1000000001
    post:
      tags:
        - Transactions
      summary: Create a transaction
      description: Creates a new financial transaction on the account. Supported
        transaction types are DEPOSIT, WITHDRAWAL, and TRANSFER. DEPOSIT adds
        funds to the account. WITHDRAWAL removes funds from the account.
        TRANSFER moves funds to another account and requires the toAccountNumber
        field. Returns a transactionId, accountNumber, customerId, amount,
        transactionType, transactionDate, reference, and status.
      operationId: createTransaction
      requestBody:
        required: true
        description: Transaction request payload. amount, transactionType, and currency
          are required. toAccountNumber is required when transactionType is
          TRANSFER.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
            examples:
              DepositRequest:
                $ref: "#/components/examples/TransactionDepositRequestExample"
              WithdrawalRequest:
                $ref: "#/components/examples/TransactionWithdrawalRequestExample"
              TransferRequest:
                $ref: "#/components/examples/TransactionTransferRequestExample"
      responses:
        "201":
          description: Transaction created successfully. Returns the full transaction
            record with auto-generated transactionId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
              examples:
                CreatedTransaction:
                  $ref: "#/components/examples/TransactionResponseExample"
        "400":
          description: Validation failed. Amount is invalid or insufficient funds for
            withdrawal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                ValidationFailed:
                  $ref: "#/components/examples/ValidationErrorExample"
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
    get:
      tags:
        - Transactions
      summary: List transactions for an account
      description: Returns a paginated list of transactions for the given
        accountNumber. Supports pagination via page and size parameters.
        Supports date range filtering via fromDate and toDate parameters in
        YYYY-MM-DD format. Results are ordered by transactionDate descending.
      operationId: listTransactions
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number. Default is 0.
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Number of records per page. Default is 20. Maximum is 100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
        - name: fromDate
          in: query
          required: false
          description: Start date for transaction date filter in YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: 2024-01-01
        - name: toDate
          in: query
          required: false
          description: End date for transaction date filter in YYYY-MM-DD format.
          schema:
            type: string
            format: date
          example: 2024-12-31
      responses:
        "200":
          description: Paginated list of transactions returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
              examples:
                TransactionList:
                  $ref: "#/components/examples/TransactionListResponseExample"
        "400":
          description: Invalid query parameter value supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequestErrorExample"
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
components:
  schemas:
    AccountCreateRequest:
      type: object
      description: Payload for creating a new bank account. customerId must reference
        an existing customer. accountType must be SAVINGS, CURRENT, or
        FIXED_DEPOSIT. currency defaults to INR.
      required:
        - customerId
        - accountType
        - branch
      properties:
        customerId:
          type: integer
          format: int64
          description: Customer ID of the account owner. Must be a valid existing customer
            between 1001 and 1020.
          minimum: 1001
          example: 1001
        accountType:
          type: string
          description: Type of bank account. Allowed values are SAVINGS, CURRENT,
            FIXED_DEPOSIT.
          enum:
            - SAVINGS
            - CURRENT
            - FIXED_DEPOSIT
          example: SAVINGS
        currency:
          type: string
          description: Account currency. Defaults to INR. Maximum 3 characters ISO 4217
            currency code.
          default: INR
          maxLength: 3
          example: INR
        branch:
          type: string
          description: Branch name where the account is held. Maximum 100 characters.
          maxLength: 100
          example: Vizianagaram Main Branch
        ifscCode:
          type: string
          description: IFSC code of the branch. 11-character alphanumeric code. First 4
            characters are bank code, 5th is 0, last 6 are branch code.
          pattern: ^[A-Z]{4}0[A-Z0-9]{6}$
          example: SBIN0001234
        nickname:
          type: string
          description: Optional friendly name for the account. Maximum 50 characters.
          maxLength: 50
          example: My Savings Account
        initialDeposit:
          type: number
          format: double
          description: Initial deposit amount in the account currency. Must be zero or
            greater.
          minimum: 0
          example: 10000
    AccountUpdateRequest:
      type: object
      description: Payload for updating mutable fields of an existing account. All
        fields are optional. Provide only the fields to update.
      properties:
        nickname:
          type: string
          description: Updated friendly name for the account. Maximum 50 characters.
          maxLength: 50
          example: My Updated Savings Account
        status:
          type: string
          description: Updated account status. Allowed values are ACTIVE, INACTIVE, CLOSED.
          enum:
            - ACTIVE
            - INACTIVE
            - CLOSED
          example: INACTIVE
        branch:
          type: string
          description: Updated branch name. Maximum 100 characters.
          maxLength: 100
          example: Hyderabad Central Branch
    AccountResponse:
      type: object
      description: Complete account profile returned by the backend after creation or
        retrieval. Contains auto-generated accountNumber.
      properties:
        accountNumber:
          type: integer
          format: int64
          description: Auto-generated unique numeric account number assigned by the
            backend. Starts from 1000000001.
          example: 1000000001
        customerId:
          type: integer
          format: int64
          description: Customer ID of the account owner.
          example: 1001
        accountType:
          type: string
          description: Type of bank account. One of SAVINGS, CURRENT, FIXED_DEPOSIT.
          enum:
            - SAVINGS
            - CURRENT
            - FIXED_DEPOSIT
          example: SAVINGS
        status:
          type: string
          description: Account status. One of ACTIVE, INACTIVE, CLOSED. Defaults to ACTIVE
            on creation.
          enum:
            - ACTIVE
            - INACTIVE
            - CLOSED
          example: ACTIVE
        balance:
          type: number
          format: double
          description: Current account balance. Must be zero or greater.
          minimum: 0
          example: 10000
        currency:
          type: string
          description: Account currency. Defaults to INR.
          example: INR
        branch:
          type: string
          description: Branch name where the account is held.
          example: Vizianagaram Main Branch
        ifscCode:
          type: string
          description: IFSC code of the branch.
          example: SBIN0001234
        nickname:
          type: string
          description: Friendly name for the account.
          example: My Savings Account
        createdDate:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the account was created.
          example: 2024-01-15T10:30:00Z
        lastUpdated:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the account was last updated.
          example: 2024-06-01T14:22:00Z
    AccountSummary:
      type: object
      description: Lightweight account summary object used inside list responses.
        Contains key fields only.
      properties:
        accountNumber:
          type: integer
          format: int64
          description: Unique numeric account number.
          example: 1000000001
        customerId:
          type: integer
          format: int64
          description: Customer ID of the account owner.
          example: 1001
        accountType:
          type: string
          description: Type of bank account.
          enum:
            - SAVINGS
            - CURRENT
            - FIXED_DEPOSIT
          example: SAVINGS
        status:
          type: string
          description: Account status.
          enum:
            - ACTIVE
            - INACTIVE
            - CLOSED
          example: ACTIVE
        balance:
          type: number
          format: double
          description: Current account balance.
          example: 10000
        currency:
          type: string
          description: Account currency.
          example: INR
        branch:
          type: string
          description: Branch name.
          example: Vizianagaram Main Branch
        createdDate:
          type: string
          format: date-time
          description: Account creation timestamp.
          example: 2024-01-15T10:30:00Z
    AccountListResponse:
      type: object
      description: Paginated list of account summaries returned by GET /accounts and
        GET /accounts/customer/{customerId}.
      properties:
        accounts:
          type: array
          description: Array of account summary objects for the current page.
          items:
            $ref: "#/components/schemas/AccountSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
    AccountBalanceResponse:
      type: object
      description: Account balance details returned by GET
        /accounts/{accountNumber}/balance.
      properties:
        accountNumber:
          type: integer
          format: int64
          description: Unique numeric account number.
          example: 1000000001
        availableBalance:
          type: number
          format: double
          description: Amount available for immediate withdrawal or use. Excludes pending
            transactions.
          minimum: 0
          example: 9500
        ledgerBalance:
          type: number
          format: double
          description: Total balance including all pending and posted transactions.
          minimum: 0
          example: 10000
        currency:
          type: string
          description: Account currency code.
          example: INR
        lastUpdated:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the last balance update.
          example: 2024-06-01T14:22:00Z
    TransactionRequest:
      type: object
      description: Payload for creating a new financial transaction. transactionType
        must be DEPOSIT, WITHDRAWAL, or TRANSFER. toAccountNumber is required
        when transactionType is TRANSFER.
      required:
        - amount
        - transactionType
        - currency
      properties:
        amount:
          type: number
          format: double
          description: Transaction amount. Must be greater than zero.
          minimum: 0.01
          example: 5000
        transactionType:
          type: string
          description: Type of transaction. DEPOSIT adds funds. WITHDRAWAL removes funds.
            TRANSFER moves funds to another account.
          enum:
            - DEPOSIT
            - WITHDRAWAL
            - TRANSFER
          example: DEPOSIT
        currency:
          type: string
          description: Transaction currency. Must match the account currency. Defaults to
            INR.
          default: INR
          maxLength: 3
          example: INR
        toAccountNumber:
          type: integer
          format: int64
          description: Destination account number for TRANSFER transactions. Required when
            transactionType is TRANSFER.
          example: 1000000002
        reference:
          type: string
          description: Optional payment reference or remarks. Maximum 200 characters.
          maxLength: 200
          example: Monthly rent payment
        narration:
          type: string
          description: Optional transaction narration or description. Maximum 200
            characters.
          maxLength: 200
          example: Transfer to savings account
    TransactionResponse:
      type: object
      description: Full transaction record returned after a transaction is created or
        retrieved.
      properties:
        transactionId:
          type: string
          description: Auto-generated unique transaction identifier assigned by the backend.
          example: TXN20240115001
        accountNumber:
          type: integer
          format: int64
          description: Account number on which the transaction was performed.
          example: 1000000001
        customerId:
          type: integer
          format: int64
          description: Customer ID of the account owner.
          example: 1001
        amount:
          type: number
          format: double
          description: Transaction amount.
          example: 5000
        transactionType:
          type: string
          description: Type of transaction. One of DEPOSIT, WITHDRAWAL, TRANSFER.
          enum:
            - DEPOSIT
            - WITHDRAWAL
            - TRANSFER
          example: DEPOSIT
        currency:
          type: string
          description: Transaction currency.
          example: INR
        toAccountNumber:
          type: integer
          format: int64
          description: Destination account number for TRANSFER transactions.
          example: 1000000002
        reference:
          type: string
          description: Payment reference or remarks.
          example: Monthly rent payment
        narration:
          type: string
          description: Transaction narration.
          example: Transfer to savings account
        transactionDate:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the transaction was processed.
          example: 2024-01-15T10:30:00Z
        status:
          type: string
          description: Transaction status. One of SUCCESS, FAILED, PENDING.
          enum:
            - SUCCESS
            - FAILED
            - PENDING
          example: SUCCESS
        balanceAfterTransaction:
          type: number
          format: double
          description: Account balance after this transaction was applied.
          example: 15000
    TransactionListResponse:
      type: object
      description: Paginated list of transactions returned by GET
        /accounts/{accountNumber}/transactions.
      properties:
        transactions:
          type: array
          description: Array of transaction records for the current page.
          items:
            $ref: "#/components/schemas/TransactionResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Pagination:
      type: object
      description: Pagination metadata included in list responses.
      properties:
        page:
          type: integer
          description: Current zero-based page number.
          example: 0
        size:
          type: integer
          description: Number of records per page.
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total number of records matching the query.
          example: 20
        totalPages:
          type: integer
          description: Total number of pages available.
          example: 1
        hasNext:
          type: boolean
          description: True if a next page exists.
          example: false
        hasPrevious:
          type: boolean
          description: True if a previous page exists.
          example: false
    ApiError:
      type: object
      description: Standard error response for all non-validation errors. Returned for
        404, 409, 500 responses.
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred.
          example: 2024-01-15T10:30:00Z
        status:
          type: integer
          description: HTTP status code.
          example: 404
        error:
          type: string
          description: Short error type label.
          example: Not Found
        message:
          type: string
          description: Human-readable description of the error.
          example: Account with number 1000000001 not found.
        path:
          type: string
          description: Request path that caused the error.
          example: /accounts/1000000001
    ValidationError:
      type: object
      description: Error response for HTTP 400 request validation failures. Contains a
        list of field-level errors.
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred.
          example: 2024-01-15T10:30:00Z
        status:
          type: integer
          description: HTTP status code. Always 400 for validation errors.
          example: 400
        error:
          type: string
          description: Error type label.
          example: Bad Request
        message:
          type: string
          description: Summary message describing the validation failure.
          example: Request validation failed. Please check field errors.
        path:
          type: string
          description: Request path that caused the error.
          example: /accounts
        fieldErrors:
          type: array
          description: List of individual field-level validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Name of the field that failed validation.
                example: customerId
              message:
                type: string
                description: Validation failure reason for this field.
                example: customerId must be a valid existing customer ID
              rejectedValue:
                type: string
                description: The value that was rejected.
                example: "9999"
