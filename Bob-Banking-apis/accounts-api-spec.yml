openapi: 3.0.3
info:
  title: Accounts API
  description: Enterprise Banking Accounts API. Manages bank account lifecycle,
    balances, and transactions.
  version: 1.0.0
  contact:
    name: Banking API Platform Team
    email: api-platform@bank.com
    url: https://developer.bank.com
  license:
    name: Internal Use Only
x-ibm-name: accounts-api
x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  type: rest
  cors:
    enabled: true
  gateway: datapower-api-gateway
  buffering: true
  properties:
    - name: target-url
      value: https://accounts-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud
      description: Base URL of the Accounts microservice backend.
      encoded: false
  activity-log:
    enabled: true
    content: activity
    error-content: payload
  assembly:
    execute:
      - invoke:
          version: 2.0.0
          title: Invoke Accounts Backend
          target-url: $(target-url)$(request.path)
          verb: keep
          timeout: 60
          follow-redirects: false
          compression: false
          inject-proxy-headers: true
          stop-on-error:
            - ConnectionError
            - OperationError
    catch:
      - errors:
          - ConnectionError
        execute:
          - set-variable:
              version: 2.0.0
              title: Set 503 Response
              actions:
                - set: message.status.code
                  value: 503
                  type: number
                - set: message.body
                  value: '{"code":503,"message":"Accounts service temporarily unavailable."}'
                  type: string
      - errors:
          - OperationError
        execute:
          - set-variable:
              version: 2.0.0
              title: Set 502 Response
              actions:
                - set: message.status.code
                  value: 502
                  type: number
                - set: message.body
                  value: '{"code":502,"message":"Bad gateway. Upstream returned an invalid
                    response."}'
                  type: string
servers:
  - url: https://accounts-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud/accounts
    description: Production
tags:
  - name: Accounts
    description: Bank account lifecycle management.
  - name: Balances
    description: Real-time account balance retrieval.
  - name: Transactions
    description: Transaction history and posting.
paths:
  /accounts:
    get:
      tags:
        - Accounts
      summary: List accounts
      description: Returns a paginated list of all bank accounts.
      operationId: listAccounts
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          description: Filter by account status.
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - name: accountType
          in: query
          required: false
          description: Filter by account type.
          schema:
            $ref: "#/components/schemas/AccountType"
      responses:
        "200":
          description: Paginated list of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
              examples:
                AccountPageExample:
                  $ref: "#/components/examples/AccountPageExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    post:
      tags:
        - Accounts
      summary: Create account
      description: Opens a new bank account and returns the assigned account record.
      operationId: createAccount
      requestBody:
        $ref: "#/components/requestBodies/AccountCreateRequest"
      responses:
        "201":
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                AccountResponseExample:
                  $ref: "#/components/examples/AccountResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  /accounts/customer/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    get:
      tags:
        - Accounts
      summary: Get accounts by customer
      description: Returns all accounts linked to the specified customer.
      operationId: getAccountsByCustomer
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by account status.
          schema:
            $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: List of accounts for the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
              examples:
                AccountListExample:
                  $ref: "#/components/examples/AccountListExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountIdParam"
    get:
      tags:
        - Accounts
      summary: Get account
      description: Returns the full record for a single bank account.
      operationId: getAccount
      responses:
        "200":
          description: Account record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                AccountResponseExample:
                  $ref: "#/components/examples/AccountResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    put:
      tags:
        - Accounts
      summary: Update account
      description: Replaces mutable fields on an existing account record.
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: Updated account record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Accounts
      summary: Close account
      description: Closes (soft-deletes) a bank account. Accounts with a non-zero
        balance cannot be closed.
      operationId: closeAccount
      responses:
        "204":
          description: Account closed. No content returned.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  /accounts/{accountId}/balance:
    parameters:
      - $ref: "#/components/parameters/AccountIdParam"
    get:
      tags:
        - Balances
      summary: Get account balance
      description: Returns the current available and ledger balances for an account.
      operationId: getAccountBalance
      responses:
        "200":
          description: Account balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
              examples:
                BalanceExample:
                  $ref: "#/components/examples/BalanceExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
  /accounts/{accountId}/transactions:
    parameters:
      - $ref: "#/components/parameters/AccountIdParam"
    get:
      tags:
        - Transactions
      summary: List transactions
      description: Returns a paginated list of transactions for an account.
      operationId: listTransactions
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: fromDate
          in: query
          required: false
          description: Start date for transaction filter (ISO 8601 date).
          schema:
            type: string
            format: date
          example: 2024-01-01
        - name: toDate
          in: query
          required: false
          description: End date for transaction filter (ISO 8601 date).
          schema:
            type: string
            format: date
          example: 2024-06-30
        - name: type
          in: query
          required: false
          description: Filter by transaction type.
          schema:
            $ref: "#/components/schemas/TransactionType"
      responses:
        "200":
          description: Paginated transaction list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
              examples:
                TransactionPageExample:
                  $ref: "#/components/examples/TransactionPageExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
    post:
      tags:
        - Transactions
      summary: Post transaction
      description: Posts a debit or credit transaction to the account.
      operationId: postTransaction
      requestBody:
        $ref: "#/components/requestBodies/TransactionCreateRequest"
      responses:
        "201":
          description: Transaction posted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
              examples:
                TransactionResponseExample:
                  $ref: "#/components/examples/TransactionResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by the bank identity provider.
  parameters:
    AccountIdParam:
      name: accountId
      in: path
      required: true
      description: Unique account identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      example: ACC-00456
    CustomerIdParam:
      name: customerId
      in: path
      required: true
      description: Unique customer identifier (CIF).
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      example: CUST-00123
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  requestBodies:
    AccountCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountCreateRequest"
          examples:
            SavingsExample:
              $ref: "#/components/examples/AccountCreateSavingsExample"
            CurrentExample:
              $ref: "#/components/examples/AccountCreateCurrentExample"
    TransactionCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionCreateRequest"
          examples:
            CreditExample:
              $ref: "#/components/examples/TransactionCreateCreditExample"
            DebitExample:
              $ref: "#/components/examples/TransactionCreateDebitExample"
  schemas:
    AccountType:
      type: string
      enum:
        - SAVINGS
        - CURRENT
        - FIXED_DEPOSIT
        - LOAN_DISBURSEMENT
      description: Classification of the bank account.
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - DORMANT
        - FROZEN
        - CLOSED
      description: Operational status of the bank account.
    Currency:
      type: string
      minLength: 3
      maxLength: 3
      description: ISO 4217 three-letter currency code.
      example: AUD
    TransactionType:
      type: string
      enum:
        - CREDIT
        - DEBIT
        - TRANSFER
        - FEE
        - INTEREST
        - REVERSAL
      description: Classification of the transaction.
    TransactionStatus:
      type: string
      enum:
        - PENDING
        - POSTED
        - FAILED
        - REVERSED
      description: Processing status of the transaction.
    Account:
      type: object
      required:
        - accountId
        - customerId
        - accountType
        - status
        - currency
        - openedAt
      properties:
        accountId:
          type: string
          description: Unique account identifier assigned by the system.
          example: ACC-00456
        customerId:
          type: string
          description: Identifier of the owning customer.
          example: CUST-00123
        accountType:
          $ref: "#/components/schemas/AccountType"
        status:
          $ref: "#/components/schemas/AccountStatus"
        currency:
          $ref: "#/components/schemas/Currency"
        nickname:
          type: string
          maxLength: 100
          description: Optional human-readable label for the account.
          example: Primary Savings
        iban:
          type: string
          maxLength: 34
          description: International Bank Account Number.
          example: AU00BANK0000000100123456
        bsb:
          type: string
          maxLength: 10
          description: Bank State Branch code (Australian accounts).
          example: 013-000
        accountNumber:
          type: string
          maxLength: 20
          description: Domestic account number.
          example: "100123456"
        openedAt:
          type: string
          format: date-time
          description: Timestamp when the account was opened (UTC, ISO 8601).
          example: 2024-01-15T09:30:00Z
        closedAt:
          type: string
          format: date-time
          description: Timestamp when the account was closed. Null if still open.
          example: null
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the most recent update (UTC, ISO 8601).
          example: 2024-06-01T14:22:00Z
    AccountCreateRequest:
      type: object
      required:
        - customerId
        - accountType
        - currency
      properties:
        customerId:
          type: string
          description: Identifier of the customer who will own this account.
          example: CUST-00123
        accountType:
          $ref: "#/components/schemas/AccountType"
        currency:
          $ref: "#/components/schemas/Currency"
        nickname:
          type: string
          maxLength: 100
          description: Optional human-readable label for the account.
          example: Primary Savings
        initialDeposit:
          type: number
          format: double
          minimum: 0
          description: Optional opening deposit amount in the account currency.
          example: 1000
    AccountUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 100
          description: Updated account nickname.
          example: Main Current Account
        status:
          $ref: "#/components/schemas/AccountStatus"
    AccountPage:
      type: object
      required:
        - data
        - page
        - pageSize
        - totalCount
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Account"
          description: Array of account records for the current page.
        page:
          type: integer
          description: Current page number.
          example: 1
        pageSize:
          type: integer
          description: Records per page.
          example: 20
        totalCount:
          type: integer
          description: Total number of matching records across all pages.
          example: 85
    AccountList:
      type: object
      required:
        - customerId
        - accounts
      properties:
        customerId:
          type: string
          description: Identifier of the queried customer.
          example: CUST-00123
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
          description: All accounts linked to this customer.
    AccountBalance:
      type: object
      required:
        - accountId
        - currency
        - availableBalance
        - ledgerBalance
        - asOf
      properties:
        accountId:
          type: string
          description: Account identifier.
          example: ACC-00456
        currency:
          $ref: "#/components/schemas/Currency"
        availableBalance:
          type: number
          format: double
          description: Funds immediately available for withdrawal or payment.
          example: 4850.75
        ledgerBalance:
          type: number
          format: double
          description: Total posted balance including pending debits.
          example: 5000
        pendingDebits:
          type: number
          format: double
          description: Sum of authorised but not yet posted debit transactions.
          example: 149.25
        asOf:
          type: string
          format: date-time
          description: Timestamp of the balance snapshot (UTC, ISO 8601).
          example: 2024-06-15T08:00:00Z
    Transaction:
      type: object
      required:
        - transactionId
        - accountId
        - type
        - status
        - amount
        - currency
        - postedAt
      properties:
        transactionId:
          type: string
          description: Unique transaction identifier.
          example: TXN-00789
        accountId:
          type: string
          description: Account to which this transaction belongs.
          example: ACC-00456
        type:
          $ref: "#/components/schemas/TransactionType"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        amount:
          type: number
          format: double
          description: Transaction amount. Always positive; direction is determined by type.
          example: 250
        currency:
          $ref: "#/components/schemas/Currency"
        description:
          type: string
          maxLength: 200
          description: Narrative or reference for the transaction.
          example: Salary deposit - June 2024
        referenceId:
          type: string
          maxLength: 100
          description: External reference or payment instruction ID.
          example: PAY-REF-20240601
        counterpartyName:
          type: string
          maxLength: 100
          description: Name of the sending or receiving party.
          example: Acme Corp Pty Ltd
        postedAt:
          type: string
          format: date-time
          description: Timestamp when the transaction was posted (UTC, ISO 8601).
          example: 2024-06-01T09:00:00Z
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the transaction record was created (UTC, ISO 8601).
          example: 2024-06-01T08:58:00Z
    TransactionCreateRequest:
      type: object
      required:
        - type
        - amount
        - currency
      properties:
        type:
          $ref: "#/components/schemas/TransactionType"
        amount:
          type: number
          format: double
          minimum: 0.01
          description: Transaction amount. Must be greater than zero.
          example: 250
        currency:
          $ref: "#/components/schemas/Currency"
        description:
          type: string
          maxLength: 200
          description: Narrative or reference for the transaction.
          example: Salary deposit - June 2024
        referenceId:
          type: string
          maxLength: 100
          description: Idempotency key or external reference ID.
          example: PAY-REF-20240601
        counterpartyName:
          type: string
          maxLength: 100
          description: Name of the sending or receiving party.
          example: Acme Corp Pty Ltd
    TransactionPage:
      type: object
      required:
        - data
        - page
        - pageSize
        - totalCount
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
          description: Array of transaction records for the current page.
        page:
          type: integer
          description: Current page number.
          example: 1
        pageSize:
          type: integer
          description: Records per page.
          example: 20
        totalCount:
          type: integer
          description: Total number of matching transactions across all pages.
          example: 310
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 400
        message:
          type: string
          description: Human-readable error description.
          example: The request payload is invalid.
        details:
          type: array
          description: Field-level validation errors.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Name of the field that failed validation.
          example: currency
        message:
          type: string
          description: Validation failure reason.
          example: Must be a valid ISO 4217 currency code.
  responses:
    BadRequest:
      description: Bad Request. The request payload is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 400
            message: The request payload is invalid.
            details:
              - field: currency
                message: Must be a valid ISO 4217 currency code.
    Unauthorized:
      description: Unauthorized. A valid Bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 401
            message: Authentication token is missing or invalid.
    Forbidden:
      description: Forbidden. The caller does not have permission for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 403
            message: Insufficient scope for this operation.
    NotFound:
      description: Not Found. The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 404
            message: Account not found.
    Conflict:
      description: Conflict. The operation cannot be completed due to a state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 409
            message: Account cannot be closed because the balance is non-zero.
    UnprocessableEntity:
      description: Unprocessable Entity. The transaction cannot be processed due to a
        business rule violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 422
            message: Insufficient available balance for this debit transaction.
    InternalServerError:
      description: Internal Server Error. An unexpected condition was encountered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: 500
            message: An unexpected error occurred. Please try again later.
  examples:
    AccountCreateSavingsExample:
      summary: Open a savings account
      value:
        customerId: CUST-00123
        accountType: SAVINGS
        currency: AUD
        nickname: Primary Savings
        initialDeposit: 1000
    AccountCreateCurrentExample:
      summary: Open a current account
      value:
        customerId: CUST-00123
        accountType: CURRENT
        currency: AUD
        nickname: Main Current Account
    AccountResponseExample:
      summary: Typical account response
      value:
        accountId: ACC-00456
        customerId: CUST-00123
        accountType: SAVINGS
        status: ACTIVE
        currency: AUD
        nickname: Primary Savings
        bsb: 013-000
        accountNumber: "100123456"
        openedAt: 2024-01-15T09:30:00Z
        closedAt: null
        updatedAt: 2024-06-01T14:22:00Z
    AccountPageExample:
      summary: Paginated account list
      value:
        data:
          - accountId: ACC-00456
            customerId: CUST-00123
            accountType: SAVINGS
            status: ACTIVE
            currency: AUD
            nickname: Primary Savings
            openedAt: 2024-01-15T09:30:00Z
            updatedAt: 2024-06-01T14:22:00Z
          - accountId: ACC-00457
            customerId: CUST-00124
            accountType: CURRENT
            status: ACTIVE
            currency: AUD
            nickname: Main Current Account
            openedAt: 2024-02-10T11:00:00Z
            updatedAt: 2024-05-30T09:00:00Z
        page: 1
        pageSize: 20
        totalCount: 2
    AccountListExample:
      summary: Accounts for a customer
      value:
        customerId: CUST-00123
        accounts:
          - accountId: ACC-00456
            customerId: CUST-00123
            accountType: SAVINGS
            status: ACTIVE
            currency: AUD
            nickname: Primary Savings
            openedAt: 2024-01-15T09:30:00Z
            updatedAt: 2024-06-01T14:22:00Z
          - accountId: ACC-00458
            customerId: CUST-00123
            accountType: CURRENT
            status: ACTIVE
            currency: AUD
            nickname: Everyday Account
            openedAt: 2024-03-01T10:00:00Z
            updatedAt: 2024-06-01T14:22:00Z
    BalanceExample:
      summary: Current account balance
      value:
        accountId: ACC-00456
        currency: AUD
        availableBalance: 4850.75
        ledgerBalance: 5000
        pendingDebits: 149.25
        asOf: 2024-06-15T08:00:00Z
    TransactionCreateCreditExample:
      summary: Post a credit transaction
      value:
        type: CREDIT
        amount: 2500
        currency: AUD
        description: Salary deposit - June 2024
        referenceId: PAY-REF-20240601
        counterpartyName: Acme Corp Pty Ltd
    TransactionCreateDebitExample:
      summary: Post a debit transaction
      value:
