            example: l1a2b3c4-0003-0003-0003-000000000001
        required:
          - applicationId
      title: Retrieve a previously generated loan risk score by application ID
      x-api-binding:
        operationPath: /risk/loan-risk-score/{applicationId}
        operationMethod: GET
        api:
          $path: ./risk-compliance-api-spec.yml
    - name: getCustomerComplianceReport
      description: >
        Returns a consolidated compliance summary including the latest results
        of

        KYC, sanctions, AML, fraud, credit score, and risk assessments for a

        customer. Intended for regulatory reporting and internal audit use.
      inputSchema:
        type: object
        properties:
          customerId:
            description: Unique customer identifier (UUID v4). Foreign key from Customer
              API.
            x-parameter-location: path
            type: string
            format: uuid
            example: c1a2b3c4-0001-0001-0001-000000000001
        required:
          - customerId
      title: Retrieve a full compliance audit report for a customer
      x-api-binding:
        operationPath: /risk/reports/customer/{customerId}
        operationMethod: GET
        api:
          $path: ./risk-compliance-api-spec.yml
    - name: getApplicationComplianceReport
      description: |
        Returns the full set of compliance check results executed as part of the
        loan eligibility workflow for a specific `applicationId`. Includes all
        six orchestration steps and the final risk score verdict.
      inputSchema:
        type: object
        properties:
          applicationId:
            description: Unique loan application identifier (UUID v4). Foreign key from Loan
              API.
            x-parameter-location: path
            type: string
            format: uuid
            example: l1a2b3c4-0003-0003-0003-000000000001
        required:
          - applicationId
      title: Retrieve a compliance report for a specific loan application
      x-api-binding:
        operationPath: /risk/reports/application/{applicationId}
        operationMethod: GET
        api:
          $path: ./risk-compliance-api-spec.yml
