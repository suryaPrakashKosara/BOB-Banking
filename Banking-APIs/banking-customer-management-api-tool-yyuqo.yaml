kind: MCPTools
apiVersion: api.ibm.com/v1
metadata:
  name: banking-customer-management-api-tool-yyuqo
  namespace: Banking-APIs
  version: "1.0"
  tags: []
  description: Master customer service for the Agentic Banking Platform. Manages
    the full lifecycle of customer records and serves as the single source of
    truth for customer identity across all downstream services. customerId is
    the common identifier shared by the Accounts API, Loan API, Risk API, and
    Payments API. Customer records created through this API are immediately
    consumable by all downstream banking services.
  labels:
    api-spec: ./banking-customer-management-api-spec.yml
spec:
  tools:
    - name: createCustomer
      description: Creates a new customer record in the banking platform. The request
        body must be a flat JSON object. All address fields are top-level
        strings. Do not use nested address objects. The customerId is
        auto-generated by the backend starting from 1001. Defaults applied on
        creation are customerType INDIVIDUAL, country India, status ACTIVE,
        kycStatus PENDING, and riskCategory LOW. The returned customerId is
        immediately usable by the Accounts, Loan, Risk, and Payments APIs.
      inputSchema:
        type: object
        properties:
          firstName:
            type: string
            description: Customer first name. Required.
            example: Surya
          lastName:
            type: string
            description: Customer last name. Required.
            example: Prakash
          email:
            type: string
            description: Customer email address. Must be unique across the platform.
              Required.
            example: surya@test.com
          mobileNumber:
            type: string
            description: Customer mobile number. Required.
            example: "9876543210"
          address:
            type: string
            description: Street address as a flat string. Required. Do not use a nested
              address object.
            example: Mandala Veedhi
          city:
            type: string
            description: City of residence. Required.
            example: Vizianagaram
          state:
            type: string
            description: State of residence. Required.
            example: Andhra Pradesh
          country:
            type: string
            description: Country of residence. Defaults to India.
            default: India
            example: India
          dateOfBirth:
            type: string
            description: Date of birth in YYYY-MM-DD format. Required.
            example: 1998-02-20
          pan:
            type: string
            description: Permanent Account Number. Must be unique across the platform.
              Required.
            example: ABCDE1234F
          aadhaar:
            type: string
            description: 12-digit Aadhaar number. Must be unique across the platform.
              Required.
            example: "123456789012"
          customerType:
            type: string
            description: Customer type. Allowed values are INDIVIDUAL and CORPORATE.
              Defaults to INDIVIDUAL.
            enum:
              - INDIVIDUAL
              - CORPORATE
            default: INDIVIDUAL
            example: INDIVIDUAL
        required:
          - firstName
          - lastName
          - email
          - mobileNumber
          - address
          - city
          - state
          - country
          - dateOfBirth
          - pan
          - aadhaar
          - customerType
      title: Create Customer
      x-api-binding:
        operationPath: /customers
        operationMethod: POST
        api:
          $path: ./banking-customer-management-api-spec.yml
    - name: listCustomers
      description: Returns all customer records. Supports optional filtering via query
        parameters. The response envelope contains customers as an array of
        customer objects and total as the count of all matching records. Use
        page and size for pagination. Consumed by the Risk API for batch scoring
        and by the Loan API for eligibility checks.
      inputSchema:
        type: object
        properties:
          page:
            description: Zero-based page number for pagination. Default is 0.
            x-parameter-location: query
            type: integer
            default: 0
            minimum: 0
          size:
            description: Number of records per page. Default is 20.
            x-parameter-location: query
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          status:
            description: Filter by customer status. Allowed values are ACTIVE, INACTIVE,
              SUSPENDED.
            x-parameter-location: query
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - SUSPENDED
          customerType:
            description: Filter by customer type. Allowed values are INDIVIDUAL, CORPORATE.
            x-parameter-location: query
            type: string
            enum:
              - INDIVIDUAL
              - CORPORATE
      title: List Customers
      x-api-binding:
        operationPath: /customers
        operationMethod: GET
        api:
          $path: ./banking-customer-management-api-spec.yml
    - name: getCustomerById
      description: Returns the complete customer profile for the given customerId. The
        response includes all customer fields including KYC information such as
        kycStatus, pan, aadhaar, and riskCategory. Consumed by the Accounts API
        to validate a customer before opening an account, by the Loan API during
        loan application, by the Payments API before payment processing, and by
        the Risk API for risk assessment.
      inputSchema:
        type: object
        properties:
          customerId:
            description: Unique numeric customer identifier. Existing IDs start from 1001.
            x-parameter-location: path
            type: integer
            minimum: 1001
        required:
          - customerId
      title: Get Customer
      x-api-binding:
        operationPath: /customers/{customerId}
        operationMethod: GET
        api:
          $path: ./banking-customer-management-api-spec.yml
    - name: updateCustomer
      description: Updates one or more customer attributes for an existing customer.
        Only the fields present in the request should be updated. All other
        fields must remain unchanged.
      inputSchema:
        type: object
        properties:
          customerId:
            description: Unique numeric customer identifier. Existing IDs start from 1001.
            x-parameter-location: path
            type: integer
            minimum: 1001
          firstName:
            type: string
            description: Customer first name.
            example: Aarav
          lastName:
            type: string
            description: Customer last name.
            example: Sharma
          email:
            type: string
            description: Customer email address.
            example: john.updated@example.com
          mobileNumber:
            type: string
            description: Customer mobile number.
            example: "9876543210"
          address:
            type: string
            description: Street address as a flat string. Do not use a nested address
              object.
            example: 12, MG Road
          city:
            type: string
            description: City of residence.
            example: Mumbai
          state:
            type: string
            description: State of residence.
            example: Maharashtra
          country:
            type: string
            description: Country of residence.
            example: India
          dateOfBirth:
            type: string
            description: Date of birth in YYYY-MM-DD format.
            example: 1985-03-15
          pan:
            type: string
            description: Permanent Account Number.
            example: AAAPS1234A
          aadhaar:
            type: string
            description: 12-digit Aadhaar number.
            example: "234567890123"
          customerType:
            type: string
            description: Customer type. Allowed values are INDIVIDUAL and CORPORATE.
            enum:
              - INDIVIDUAL
              - CORPORATE
            example: INDIVIDUAL
          status:
            type: string
            description: Customer account status. Allowed values are ACTIVE, INACTIVE,
              SUSPENDED.
            enum:
              - ACTIVE
              - INACTIVE
              - SUSPENDED
            example: ACTIVE
          riskCategory:
            type: string
            description: Risk classification. Allowed values are LOW, MEDIUM, HIGH.
            enum:
              - LOW
              - MEDIUM
              - HIGH
            example: LOW
          kycStatus:
            type: string
            description: KYC verification status. Allowed values are PENDING, VERIFIED,
              REJECTED.
            enum:
              - PENDING
              - VERIFIED
              - REJECTED
            example: VERIFIED
        required:
          - customerId
      title: Update Customer
      x-api-binding:
        operationPath: /customers/{customerId}
        operationMethod: PUT
        api:
          $path: ./banking-customer-management-api-spec.yml
    - name: deleteCustomer
      description: Soft-deletes the customer record. The backend sets the customer
        status to INACTIVE. The record is retained in the database. After
        deletion the Accounts API rejects new account creation for this
        customer, the Loan API rejects new loan applications, and the Payments
        API blocks payment processing for this customer.
      inputSchema:
        type: object
        properties:
          customerId:
            description: Unique numeric customer identifier. Existing IDs start from 1001.
            x-parameter-location: path
            type: integer
            minimum: 1001
        required:
          - customerId
      title: Delete Customer
      x-api-binding:
        operationPath: /customers/{customerId}
        operationMethod: DELETE
        api:
          $path: ./banking-customer-management-api-spec.yml
