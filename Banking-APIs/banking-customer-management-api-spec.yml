openapi: 3.0.3
info:
  title: Banking Customer Management API
  version: 1.0.0
  description: Master customer service for the Agentic Banking Platform. Manages
    the full lifecycle of customer records and serves as the single source of
    truth for customer identity across all downstream services. customerId is
    the common identifier shared by the Accounts API, Loan API, Risk API, and
    Payments API. Customer records created through this API are immediately
    consumable by all downstream banking services.
  contact:
    name: Agentic Banking Platform Team
    email: banking-platform@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://customer-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud
    description: Production Backend - IBM Code Engine au-syd
security: []
x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  gateway: datapower-api-gateway
  cors:
    enabled: true
  assembly:
    execute:
      - rate-limit:
          version: 2.0.0
          title: Customer Rate Limit
          max: 5
          interval: 60
          unit: second
          hard-limit: false
          api-limit: true
      - invoke:
          version: 2.0.0
          title: Invoke Customer Backend
          target-url: $(request.protocol)://$(request.host)$(request.path)
          verb: keep
          timeout: 60
          stop-on-error:
            - ConnectionError
            - OperationError
tags:
  - name: Customers
    description: Customer profile lifecycle operations. Create, list, retrieve, and
      delete customer records. Records created here are consumed by the
      Accounts, Loan, Risk, and Payments APIs using customerId as the common
      identifier.
  - name: KYC
    description: Know Your Customer verification operations. Returns KYC status,
      PAN, Aadhaar, and risk category for a given customer. KYC data is
      projected from the main customer record by the API gateway.
paths:
  /customers:
    post:
      tags:
        - Customers
      operationId: createCustomer
      summary: Create Customer
      description: Creates a new customer record in the banking platform. The request
        body must be a flat JSON object. All address fields are top-level
        strings. Do not use nested address objects. The customerId is
        auto-generated by the backend starting from 1001. Defaults applied on
        creation are customerType INDIVIDUAL, country India, status ACTIVE,
        kycStatus PENDING, and riskCategory LOW. The returned customerId is
        immediately usable by the Accounts, Loan, Risk, and Payments APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateRequest"
            example:
              firstName: Surya
              lastName: Prakash
              email: surya@test.com
              mobileNumber: "9876543210"
              address: Mandala Veedhi
              city: Vizianagaram
              state: Andhra Pradesh
              country: India
              dateOfBirth: 1998-02-20
              pan: ABCDE1234F
              aadhaar: "123456789012"
              customerType: INDIVIDUAL
      responses:
        "201":
          description: Customer created successfully. Returns the complete customer
            profile with the auto-generated customerId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
              example:
                customerId: 1021
                firstName: Surya
                lastName: Prakash
                fullName: Surya Prakash
                email: surya@test.com
                mobileNumber: "9876543210"
                address: Mandala Veedhi
                city: Vizianagaram
                state: Andhra Pradesh
                country: India
                customerType: INDIVIDUAL
                dateOfBirth: 1998-02-20
                pan: ABCDE1234F
                aadhaar: "123456789012"
                kycStatus: PENDING
                riskCategory: LOW
                status: ACTIVE
                createdDate: 2024-01-15T10:30:00
        "400":
          description: Validation failed. One or more required fields are missing or
            contain invalid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "Missing required fields: lastName, email, mobileNumber"
                status: 400
        "409":
          description: Conflict. A customer with the same email, PAN, or Aadhaar already
            exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Email 'surya@test.com' already registered.
                status: 409
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: An unexpected error occurred. Please try again later.
                status: 500
    get:
      tags:
        - Customers
      operationId: listCustomers
      summary: List Customers
      description: Returns all customer records. Supports optional filtering via query
        parameters. The response envelope contains customers as an array of
        customer objects and total as the count of all matching records. Use
        page and size for pagination. Consumed by the Risk API for batch scoring
        and by the Loan API for eligibility checks.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number for pagination. Default is 0.
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Number of records per page. Default is 20.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
        - name: status
          in: query
          required: false
          description: Filter by customer status. Allowed values are ACTIVE, INACTIVE,
            SUSPENDED.
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - SUSPENDED
          example: ACTIVE
        - name: customerType
          in: query
          required: false
          description: Filter by customer type. Allowed values are INDIVIDUAL, CORPORATE.
          schema:
            type: string
            enum:
              - INDIVIDUAL
              - CORPORATE
          example: INDIVIDUAL
      responses:
        "200":
          description: Customer list returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
              example:
                customers:
                  - customerId: 1001
                    firstName: Aarav
                    lastName: Sharma
                    fullName: Aarav Sharma
                    email: aarav.sharma@example.in
                    mobileNumber: +91-9876543210
                    address: 12, MG Road
                    city: Mumbai
                    state: Maharashtra
                    country: India
                    customerType: INDIVIDUAL
                    dateOfBirth: 1985-03-15
                    pan: AAAPS1234A
                    aadhaar: "234567890123"
                    kycStatus: VERIFIED
                    riskCategory: LOW
                    status: ACTIVE
                    createdDate: 2019-06-01T10:00:00
                  - customerId: 1002
                    firstName: Priya
                    lastName: Patel
                    fullName: Priya Patel
                    email: priya.patel@example.in
                    mobileNumber: +91-9876543211
                    address: 45, Nehru Nagar
                    city: Ahmedabad
                    state: Gujarat
                    country: India
                    customerType: INDIVIDUAL
                    dateOfBirth: 1990-07-22
                    pan: BBBPP5678B
                    aadhaar: "345678901234"
                    kycStatus: VERIFIED
                    riskCategory: LOW
                    status: ACTIVE
                    createdDate: 2019-07-15T11:30:00
                  - customerId: 1003
                    firstName: Rohan
                    lastName: Mehta
                    fullName: Rohan Mehta
                    email: rohan.mehta@example.in
                    mobileNumber: +91-9876543212
                    address: 78, Lal Bagh
                    city: Bangalore
                    state: Karnataka
                    country: India
                    customerType: INDIVIDUAL
                    dateOfBirth: 1988-11-05
                    pan: CCCPM9012C
                    aadhaar: "456789012345"
                    kycStatus: VERIFIED
                    riskCategory: MEDIUM
                    status: ACTIVE
                    createdDate: 2019-08-20T09:15:00
                  - customerId: 1004
                    firstName: Sneha
                    lastName: Iyer
                    fullName: Sneha Iyer
                    email: sneha.iyer@example.in
                    mobileNumber: +91-9876543213
                    address: 23, Anna Salai
                    city: Chennai
                    state: Tamil Nadu
                    country: India
                    customerType: INDIVIDUAL
                    dateOfBirth: 1992-02-18
                    pan: DDDPI3456D
                    aadhaar: "567890123456"
                    kycStatus: VERIFIED
                    riskCategory: LOW
                    status: ACTIVE
                    createdDate: 2019-09-10T14:00:00
                  - customerId: 1005
                    firstName: Vikram
                    lastName: Singh
                    fullName: Vikram Singh
                    email: vikram.singh@example.in
                    mobileNumber: +91-9876543214
                    address: 67, Connaught Place
                    city: New Delhi
                    state: Delhi
                    country: India
                    customerType: INDIVIDUAL
                    dateOfBirth: 1980-05-30
                    pan: EEEQS7890E
                    aadhaar: "678901234567"
                    kycStatus: VERIFIED
                    riskCategory: HIGH
                    status: ACTIVE
                    createdDate: 2019-10-05T08:45:00
                total: 20
        "400":
          description: Invalid query parameter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Invalid value for parameter status. Allowed values are ACTIVE, INACTIVE,
                  SUSPENDED.
                status: 400
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: An unexpected error occurred. Please try again later.
                status: 500
  /customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Unique numeric customer identifier. Existing IDs start from 1001.
        schema:
          type: integer
          minimum: 1001
        example: 1001
    get:
      tags:
        - Customers
      operationId: getCustomerById
      summary: Get Customer
      description: Returns the complete customer profile for the given customerId. The
        response includes all customer fields including KYC information such as
        kycStatus, pan, aadhaar, and riskCategory. Consumed by the Accounts API
        to validate a customer before opening an account, by the Loan API during
        loan application, by the Payments API before payment processing, and by
        the Risk API for risk assessment.
      responses:
        "200":
          description: Customer profile returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
              example:
                customerId: 1001
                firstName: Aarav
                lastName: Sharma
                fullName: Aarav Sharma
                email: aarav.sharma@example.in
                mobileNumber: +91-9876543210
                address: 12, MG Road
                city: Mumbai
                state: Maharashtra
                country: India
                customerType: INDIVIDUAL
                dateOfBirth: 1985-03-15
                pan: AAAPS1234A
                aadhaar: "234567890123"
                kycStatus: VERIFIED
                riskCategory: LOW
                status: ACTIVE
                createdDate: 2019-06-01T10:00:00
        "404":
          description: No customer found with the given customerId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Customer 9999 not found.
                status: 404
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: An unexpected error occurred. Please try again later.
                status: 500
    put:
      tags:
        - Customers
      operationId: updateCustomer
      summary: Update Customer
      description: Updates one or more customer attributes for an existing customer.
        Only the fields present in the request should be updated. All other
        fields must remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
            examples:
              emailAndMobileUpdate:
                summary: Update email and mobile number
                value:
                  email: john.updated@example.com
                  mobileNumber: "9876543210"
      responses:
        "200":
          description: Customer updated successfully. Returns the complete updated
            customer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
              example:
                customerId: 1001
                firstName: Aarav
                lastName: Sharma
                fullName: Aarav Sharma
                email: john.updated@example.com
                mobileNumber: "9876543210"
                customerType: INDIVIDUAL
                status: ACTIVE
        "400":
          description: Invalid request. One or more fields contain invalid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Invalid value for field 'status'. Allowed values are ACTIVE, INACTIVE,
                  SUSPENDED.
                status: 400
        "404":
          description: No customer found with the given customerId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Customer 9999 not found.
                status: 404
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: An unexpected error occurred. Please try again later.
                status: 500
    delete:
      tags:
        - Customers
      operationId: deleteCustomer
      summary: Delete Customer
      description: Soft-deletes the customer record. The backend sets the customer
        status to INACTIVE. The record is retained in the database. After
        deletion the Accounts API rejects new account creation for this
        customer, the Loan API rejects new loan applications, and the Payments
        API blocks payment processing for this customer.
      responses:
        "200":
          description: Customer deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
              example:
                message: Customer 1001 deleted successfully.
        "404":
          description: No customer found with the given customerId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Customer 9999 not found.
                status: 404
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: An unexpected error occurred. Please try again later.
                status: 500
  /customers/{customerId}/kyc:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Unique numeric customer identifier. Existing IDs start from 1001.
        schema:
          type: integer
          minimum: 1001
        example: 1001
    get:
      tags:
        - KYC
      operationId: getCustomerKYC
      summary: Get Customer KYC
      description: Returns the KYC verification details and risk classification for
        the given customer. KYC data includes kycStatus, pan, aadhaar, and
        riskCategory. This endpoint projects KYC fields from the main customer
        record. KYC status PENDING means verification has not started. KYC
        status VERIFIED means the customer is fully verified. KYC status
        REJECTED means re-submission is required. Risk category LOW means
        standard risk. Risk category MEDIUM means enhanced monitoring is
        required. Risk category HIGH means manual approval is required for
        transactions. Consumed by the Risk API for risk scoring and by the Loan
        API before loan disbursement.
      responses:
        "200":
          description: KYC details returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerKYCResponse"
              example:
                customerId: 1001
                kycStatus: VERIFIED
                pan: AAAPS1234A
                aadhaar: "234567890123"
                riskCategory: LOW
        "404":
          description: No customer found with the given customerId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: Customer 9999 not found.
                status: 404
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: An unexpected error occurred. Please try again later.
                status: 500
components:
  schemas:
    CustomerCreateRequest:
      type: object
      description: Flat JSON payload for creating a new customer. All address fields
        are top-level strings. Do not use nested address objects. Do not use
        phone, taxId, postalCode, or any nested address object. Required fields
        are firstName, lastName, email, mobileNumber, address, city, state,
        country, dateOfBirth, pan, aadhaar, and customerType.
      required:
        - firstName
        - lastName
        - email
        - mobileNumber
        - address
        - city
        - state
        - country
        - dateOfBirth
        - pan
        - aadhaar
        - customerType
      properties:
        firstName:
          type: string
          description: Customer first name. Required.
          example: Surya
        lastName:
          type: string
          description: Customer last name. Required.
          example: Prakash
        email:
          type: string
          description: Customer email address. Must be unique across the platform. Required.
          example: surya@test.com
        mobileNumber:
          type: string
          description: Customer mobile number. Required.
          example: "9876543210"
        address:
          type: string
          description: Street address as a flat string. Required. Do not use a nested
            address object.
          example: Mandala Veedhi
        city:
          type: string
          description: City of residence. Required.
          example: Vizianagaram
        state:
          type: string
          description: State of residence. Required.
          example: Andhra Pradesh
        country:
          type: string
          description: Country of residence. Defaults to India.
          default: India
          example: India
        dateOfBirth:
          type: string
          description: Date of birth in YYYY-MM-DD format. Required.
          example: 1998-02-20
        pan:
          type: string
          description: Permanent Account Number. Must be unique across the platform.
            Required.
          example: ABCDE1234F
        aadhaar:
          type: string
          description: 12-digit Aadhaar number. Must be unique across the platform.
            Required.
          example: "123456789012"
        customerType:
          type: string
          description: Customer type. Allowed values are INDIVIDUAL and CORPORATE.
            Defaults to INDIVIDUAL.
          enum:
            - INDIVIDUAL
            - CORPORATE
          default: INDIVIDUAL
          example: INDIVIDUAL
    CustomerUpdateRequest:
      type: object
      description: Partial update payload for an existing customer. All fields are
        optional. Only fields present in the request body will be updated; all
        other customer attributes remain unchanged.
      properties:
        firstName:
          type: string
          description: Customer first name.
          example: Aarav
        lastName:
          type: string
          description: Customer last name.
          example: Sharma
        email:
          type: string
          description: Customer email address.
          example: john.updated@example.com
        mobileNumber:
          type: string
          description: Customer mobile number.
          example: "9876543210"
        address:
          type: string
          description: Street address as a flat string. Do not use a nested address object.
          example: 12, MG Road
        city:
          type: string
          description: City of residence.
          example: Mumbai
        state:
          type: string
          description: State of residence.
          example: Maharashtra
        country:
          type: string
          description: Country of residence.
          example: India
        dateOfBirth:
          type: string
          description: Date of birth in YYYY-MM-DD format.
          example: 1985-03-15
        pan:
          type: string
          description: Permanent Account Number.
          example: AAAPS1234A
        aadhaar:
          type: string
          description: 12-digit Aadhaar number.
          example: "234567890123"
        customerType:
          type: string
          description: Customer type. Allowed values are INDIVIDUAL and CORPORATE.
          enum:
            - INDIVIDUAL
            - CORPORATE
          example: INDIVIDUAL
        status:
          type: string
          description: Customer account status. Allowed values are ACTIVE, INACTIVE,
            SUSPENDED.
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: ACTIVE
        riskCategory:
          type: string
          description: Risk classification. Allowed values are LOW, MEDIUM, HIGH.
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: LOW
        kycStatus:
          type: string
          description: KYC verification status. Allowed values are PENDING, VERIFIED,
            REJECTED.
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
          example: VERIFIED
    CustomerResponse:
      type: object
      description: Complete customer profile returned by create and get operations.
        Includes all customer fields including KYC fields kycStatus, pan,
        aadhaar, and riskCategory. Consumed by the Accounts, Loan, Risk, and
        Payments APIs via customerId.
      properties:
        customerId:
          type: integer
          description: Auto-generated unique customer identifier. Starts from 1001.
          example: 1001
        firstName:
          type: string
          description: Customer first name.
          example: Aarav
        lastName:
          type: string
          description: Customer last name.
          example: Sharma
        fullName:
          type: string
          description: Computed full name combining firstName and lastName.
          example: Aarav Sharma
        email:
          type: string
          description: Customer email address.
          example: aarav.sharma@example.in
        mobileNumber:
          type: string
          description: Customer mobile number.
          example: +91-9876543210
        address:
          type: string
          description: Street address as a flat string.
          example: 12, MG Road
        city:
          type: string
          description: City of residence.
          example: Mumbai
        state:
          type: string
          description: State of residence.
          example: Maharashtra
        country:
          type: string
          description: Country of residence.
          example: India
        customerType:
          type: string
          description: Customer type.
          enum:
            - INDIVIDUAL
            - CORPORATE
          example: INDIVIDUAL
        dateOfBirth:
          type: string
          description: Date of birth in YYYY-MM-DD format.
          example: 1985-03-15
        pan:
          type: string
          description: Permanent Account Number.
          example: AAAPS1234A
        aadhaar:
          type: string
          description: 12-digit Aadhaar number.
          example: "234567890123"
        kycStatus:
          type: string
          description: KYC verification status. PENDING on creation. Updated by KYC or
            Risk workflow.
          enum:
            - VERIFIED
            - PENDING
            - REJECTED
          example: VERIFIED
        riskCategory:
          type: string
          description: Risk classification assigned by the Risk API. LOW on creation.
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: LOW
        status:
          type: string
          description: Customer account status. ACTIVE on creation.
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: ACTIVE
        createdDate:
          type: string
          description: Timestamp when the customer record was created.
          example: 2019-06-01T10:00:00
    CustomerSummary:
      type: object
      description: Customer record as returned inside the CustomerListResponse array.
        Contains the same fields as CustomerResponse for full MCP tool
        consistency.
      properties:
        customerId:
          type: integer
          description: Unique customer identifier.
          example: 1001
        firstName:
          type: string
          description: Customer first name.
          example: Aarav
        lastName:
          type: string
          description: Customer last name.
          example: Sharma
        fullName:
          type: string
          description: Full name.
          example: Aarav Sharma
        email:
          type: string
          description: Customer email address.
          example: aarav.sharma@example.in
        mobileNumber:
          type: string
          description: Customer mobile number.
          example: +91-9876543210
        address:
          type: string
          description: Street address as a flat string.
          example: 12, MG Road
        city:
          type: string
          description: City of residence.
          example: Mumbai
        state:
          type: string
          description: State of residence.
          example: Maharashtra
        country:
          type: string
          description: Country of residence.
          example: India
        customerType:
          type: string
          description: Customer type.
          enum:
            - INDIVIDUAL
            - CORPORATE
          example: INDIVIDUAL
        dateOfBirth:
          type: string
          description: Date of birth in YYYY-MM-DD format.
          example: 1985-03-15
        pan:
          type: string
          description: Permanent Account Number.
          example: AAAPS1234A
        aadhaar:
          type: string
          description: 12-digit Aadhaar number.
          example: "234567890123"
        kycStatus:
          type: string
          description: KYC verification status.
          enum:
            - VERIFIED
            - PENDING
            - REJECTED
          example: VERIFIED
        riskCategory:
          type: string
          description: Risk classification.
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: LOW
        status:
          type: string
          description: Customer account status.
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: ACTIVE
        createdDate:
          type: string
          description: Timestamp of record creation.
          example: 2019-06-01T10:00:00
    CustomerListResponse:
      type: object
      description: Response envelope returned by GET /customers. Contains the
        customers array and a total count. The backend returns total as a
        top-level integer.
      properties:
        customers:
          type: array
          description: Array of customer records matching the applied filters.
          items:
            $ref: "#/components/schemas/CustomerSummary"
        total:
          type: integer
          description: Total number of customer records matching the filter across all
            pages.
          example: 20
    CustomerKYCResponse:
      type: object
      description: KYC verification details projected from the customer record.
        Returned by GET /customers/{customerId}/kyc. Contains kycStatus, pan,
        aadhaar, and riskCategory for the given customer. Consumed by the Risk
        API for risk scoring and by the Loan API before loan disbursement.
      properties:
        customerId:
          type: integer
          description: Unique customer identifier.
          example: 1001
        kycStatus:
          type: string
          description: KYC verification status. PENDING means not started. VERIFIED means
            fully verified. REJECTED means re-submission required.
          enum:
            - VERIFIED
            - PENDING
            - REJECTED
          example: VERIFIED
        pan:
          type: string
          description: Permanent Account Number.
          example: AAAPS1234A
        aadhaar:
          type: string
          description: 12-digit Aadhaar number.
          example: "234567890123"
        riskCategory:
          type: string
          description: Risk classification. LOW means standard risk. MEDIUM means enhanced
            monitoring required. HIGH means manual approval required for
            transactions.
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: LOW
    DeleteResponse:
      type: object
      description: Confirmation message returned by DELETE /customers/{customerId} on
        success.
      properties:
        message:
          type: string
          description: Human-readable confirmation of the deletion.
          example: Customer 1001 deleted successfully.
    Pagination:
      type: object
      description: Pagination parameters used with GET /customers. Pass page and size
        as query parameters to navigate pages. The response returns total as a
        top-level field.
      properties:
        page:
          type: integer
          description: Zero-based current page number.
          example: 0
        size:
          type: integer
          description: Number of records per page.
          example: 20
        total:
          type: integer
          description: Total number of matching records across all pages.
          example: 20
    ApiError:
      type: object
      description: Standard error response returned for 4xx and 5xx HTTP errors.
        Matches the exact error envelope returned by the backend.
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: Customer 9999 not found.
        status:
          type: integer
          description: HTTP status code.
          example: 404
    ValidationError:
      type: object
      description: Validation error response returned when request fields fail backend
        validation. Uses the same error and status envelope as ApiError. The
        status field is always 400.
      properties:
        error:
          type: string
          description: Validation error message describing which fields failed and why.
          example: "Missing required fields: lastName, email, mobileNumber"
        status:
          type: integer
          description: HTTP status code. Always 400 for validation errors.
          example: 400
