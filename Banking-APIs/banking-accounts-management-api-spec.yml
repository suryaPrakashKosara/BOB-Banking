openapi: 3.0.3
info:
  title: Banking Accounts Management API
  description: Accounts Management API for the Agentic Banking Platform. Manages
    the full lifecycle of bank accounts including creation, balance enquiry,
    transactions, and closure. Every account belongs to an existing customer
    identified by customerId. Integrates with Customer API, Payments API, Loan
    API, and Risk API. All services use customerId as the common identifier.
  version: 1.0.0
  contact:
    name: Agentic Banking Platform Team
    email: banking-platform@example.com
  license:
    name: Internal Use Only
    url: https://www.example.com/license
x-ibm-name: accounts-api
x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  type: rest
  cors:
    enabled: true
  gateway: datapower-api-gateway
  buffering: true
  properties:
    - name: target-url
      value: https://accounts-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud
      description: Base URL of the Accounts microservice backend.
      encoded: false
  activity-log:
    enabled: true
    content: activity
    error-content: payload
  assembly:
    execute:
      - invoke:
          version: 2.0.0
          title: Invoke Accounts Backend
          target-url: $(target-url)$(request.path)?$(request.search)
          verb: keep
          timeout: 60
          follow-redirects: false
          compression: false
          inject-proxy-headers: true
          stop-on-error:
            - ConnectionError
            - OperationError
    catch:
      - errors:
          - ConnectionError
        execute:
          - set-variable:
              version: 2.0.0
              title: Set 503 Response
              actions:
                - set: message.status.code
                  value: 503
                  type: number
                - set: message.body
                  value: '{"error":"Accounts service temporarily unavailable.","status":503}'
                  type: string
      - errors:
          - OperationError
        execute:
          - set-variable:
              version: 2.0.0
              title: Set 502 Response
              actions:
                - set: message.status.code
                  value: 502
                  type: number
                - set: message.body
                  value: '{"error":"Bad gateway. Upstream returned an invalid
                    response.","status":502}'
                  type: string
servers:
  - url: https://accounts-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud
    description: Production Backend - IBM Code Engine au-syd
tags:
  - name: Accounts
    description: Account lifecycle management operations. Create, retrieve, update,
      and close bank accounts. Every account is linked to a customer via
      customerId.
paths:
  /accounts:
    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Creates a new bank account for an existing customer. The
        accountNumber is auto-generated by the backend as a long numeric value
        starting from 1000000001. Every account must belong to a valid
        customerId between 1001 and 1020. Account types supported are SAVINGS,
        CURRENT, and FIXED_DEPOSIT. Default currency is INR. Default status is
        ACTIVE.
      operationId: createAccount
      requestBody:
        required: true
        description: Account creation payload. customerId, accountType, and branch are
          required. currency defaults to INR.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
            examples:
              SavingsAccountRequest:
                $ref: "#/components/examples/AccountCreateRequestSavingsExample"
              CurrentAccountRequest:
                $ref: "#/components/examples/AccountCreateRequestCurrentExample"
              FixedDepositRequest:
                $ref: "#/components/examples/AccountCreateRequestFDExample"
      responses:
        "201":
          description: Account created successfully. Returns the full account profile with
            auto-generated accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                CreatedAccount:
                  $ref: "#/components/examples/AccountResponseExample"
        "400":
          description: Validation failed. One or more required fields are missing or
            invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                ValidationFailed:
                  $ref: "#/components/examples/ValidationErrorExample"
        "409":
          description: Conflict. An active account of the same type already exists for
            this customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                DuplicateAccount:
                  $ref: "#/components/examples/ConflictErrorExample"
        "500":
          description: Internal server error. An unexpected condition was encountered on
            the backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
    get:
      tags:
        - Accounts
      summary: List all accounts
      description: >
        Returns a paginated list of account summaries.

        Supports optional filters for `customerId`, `accountType`, and `status`.


        **To retrieve all accounts for a specific customer**, pass `customerId`
        as a query parameter:


        ```

        GET /accounts?customerId=1001

        ```


        This is the correct backend route for customer-scoped account lookup.

        The path `/accounts/customer/{customerId}` does **not** exist on the
        backend and returns 404.


        Use `page` and `size` for pagination. Default page is 0 and default size
        is 20.
      operationId: listAccounts
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number. Default is 0.
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Number of records per page. Default is 20. Maximum is 100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
        - name: customerId
          in: query
          required: false
          description: >
            Filter accounts by customer ID. Must be a numeric value between 1001
            and 1020.

            Use this parameter to retrieve all accounts belonging to a specific
            customer.

            This is the backend-supported way to perform a customer-scoped
            account lookup.

            Example: GET /accounts?customerId=1001
          schema:
            type: integer
            format: int64
            minimum: 1001
          example: 1001
        - name: accountType
          in: query
          required: false
          description: Filter accounts by account type. Allowed values are SAVINGS,
            CURRENT, FIXED_DEPOSIT.
          schema:
            type: string
            enum:
              - SAVINGS
              - CURRENT
              - FIXED_DEPOSIT
          example: SAVINGS
        - name: status
          in: query
          required: false
          description: Filter accounts by status. Allowed values are ACTIVE, INACTIVE,
            CLOSED.
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - CLOSED
          example: ACTIVE
      responses:
        "200":
          description: Paginated list of account summaries returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
              examples:
                AccountList:
                  $ref: "#/components/examples/AccountListResponseExample"
        "400":
          description: Invalid query parameter value supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequestErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
  /accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        description: Unique account identifier (integer, range 2001-2032 for seed data).
        schema:
          type: integer
        example: 2001
    get:
      tags:
        - Accounts
      summary: Get account by ID
      description: Returns the complete account profile for the given accountId. Range
        2001-2032 for seed data.
      operationId: getAccount
      responses:
        "200":
          description: Account details returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                AccountDetails:
                  $ref: "#/components/examples/AccountResponseExample"
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
    put:
      tags:
        - Accounts
      summary: Update account details
      description: Updates mutable fields of an existing account such as status,
        branch, and ifsc.
      operationId: updateAccount
      requestBody:
        required: true
        description: Account update payload. All fields are optional. Provide only the
          fields to update.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
            examples:
              UpdateNickname:
                $ref: "#/components/examples/AccountUpdateRequestExample"
      responses:
        "200":
          description: Account updated successfully. Returns the updated account profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                UpdatedAccount:
                  $ref: "#/components/examples/AccountResponseExample"
        "400":
          description: Validation failed. One or more fields contain invalid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                ValidationFailed:
                  $ref: "#/components/examples/ValidationErrorExample"
        "404":
          description: No account found with the given accountNumber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
    delete:
      tags:
        - Accounts
      summary: Delete account
      description: Deletes the account record from the backend.
      operationId: deleteAccount
      responses:
        "200":
          description: Account deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: No account found with the given accountId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
  /customers/{customerId}/accounts:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Unique numeric customer identifier. Must be between 1001 and 1020.
        schema:
          type: integer
          format: int64
          minimum: 1001
        example: 1001
    get:
      tags:
        - Accounts
      summary: Get all accounts for a customer
      description: |
        Returns all bank accounts belonging to the given `customerId`.
        A customer may have multiple accounts of different types.

        **Backend implementation note:** The backend does not expose a dedicated
        `/customers/{customerId}/accounts` or `/accounts/customer/{customerId}` sub-path.
        The backend route for this query is:

        ```
        GET /accounts?customerId={customerId}
        ```

        In IBM API Connect, the assembly for this operation must use an **Invoke** policy
        with the target URL rewritten to:

        ```
        https://accounts-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud/accounts?customerId=$(request.parameters.customerId)
        ```

        Consumed by Loan API and Risk API to retrieve the full account portfolio of a customer.
      operationId: getAccountsByCustomer
      responses:
        "200":
          description: List of accounts for the customer returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
              examples:
                CustomerAccounts:
                  $ref: "#/components/examples/CustomerAccountsResponseExample"
        "404":
          description: No customer found with the given customerId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                NotFound:
                  $ref: "#/components/examples/CustomerNotFoundErrorExample"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                ServerError:
                  $ref: "#/components/examples/ServerErrorExample"
components:
  schemas:
    AccountCreateRequest:
      type: object
      description: Payload for creating a new bank account. customerId must reference
        an existing customer. accountType must be SAVINGS, CURRENT, or
        FIXED_DEPOSIT. currency defaults to INR.
      required:
        - customerId
        - accountType
        - branch
        - ifsc
      properties:
        customerId:
          type: integer
          format: int64
          description: Customer ID of the account owner. Must be a valid existing customer
            between 1001 and 1020.
          minimum: 1001
          example: 1001
        accountType:
          type: string
          description: Type of bank account. Allowed values are SAVINGS, CURRENT,
            FIXED_DEPOSIT.
          enum:
            - SAVINGS
            - CURRENT
            - FIXED_DEPOSIT
          example: SAVINGS
        currency:
          type: string
          description: Account currency. Defaults to INR. Maximum 3 characters ISO 4217
            currency code.
          default: INR
          maxLength: 3
          example: INR
        branch:
          type: string
          description: Branch name where the account is held. Maximum 100 characters.
          maxLength: 100
          example: Vizianagaram Main Branch
        ifsc:
          type: string
          description: IFSC code of the branch. 11-character alphanumeric code. First 4
            characters are bank code, 5th is 0, last 6 are branch code.
          pattern: ^[A-Z]{4}0[A-Z0-9]{6}$
          example: SBIN0001234
        nickname:
          type: string
          description: Optional friendly name for the account. Maximum 50 characters.
          maxLength: 50
          example: My Savings Account
        initialDeposit:
          type: number
          format: double
          description: Initial deposit amount in the account currency. Must be zero or
            greater.
          minimum: 0
          example: 10000
    AccountUpdateRequest:
      type: object
      description: Payload for updating mutable fields of an existing account. All
        fields are optional. Provide only the fields to update.
      properties:
        nickname:
          type: string
          description: Updated friendly name for the account. Maximum 50 characters.
          maxLength: 50
          example: My Updated Savings Account
        status:
          type: string
          description: Updated account status. Allowed values are ACTIVE, INACTIVE, CLOSED.
          enum:
            - ACTIVE
            - INACTIVE
            - CLOSED
          example: INACTIVE
        branch:
          type: string
          description: Updated branch name. Maximum 100 characters.
          maxLength: 100
          example: Hyderabad Central Branch
    AccountResponse:
      type: object
      description: Complete account profile returned by the backend after creation or
        retrieval.
      properties:
        accountId:
          type: integer
          description: Auto-generated unique account identifier.
          example: 2001
        accountNumber:
          type: string
          description: Account number string (e.g. ACCT2001).
          example: ACCT2001
        customerId:
          type: integer
          description: Customer ID of the account owner.
          example: 1001
        accountType:
          type: string
          enum:
            - SAVINGS
            - CURRENT
            - FIXED_DEPOSIT
            - RECURRING_DEPOSIT
            - NRI
          example: SAVINGS
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - FROZEN
            - CLOSED
          example: ACTIVE
        balance:
          type: number
          format: double
          example: 125000
        currency:
          type: string
          example: INR
        branch:
          type: string
          example: Mumbai Main Branch
        ifsc:
          type: string
          example: HDFC0001001
        createdDate:
          type: string
          format: date
          example: 2019-06-01
    AccountListResponse:
      type: object
      description: List of account records returned by GET /accounts.
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountResponse"
        total:
          type: integer
          example: 32
    Pagination:
      type: object
      description: Pagination metadata included in list responses.
      properties:
        page:
          type: integer
          description: Current zero-based page number.
          example: 0
        size:
          type: integer
          description: Number of records per page.
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total number of records matching the query.
          example: 20
        totalPages:
          type: integer
          description: Total number of pages available.
          example: 1
        hasNext:
          type: boolean
          description: True if a next page exists.
          example: false
        hasPrevious:
          type: boolean
          description: True if a previous page exists.
          example: false
    ApiError:
      type: object
      description: Standard error response for all non-validation errors. Returned for
        404, 409, 500 responses.
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred.
          example: 2024-01-15T10:30:00Z
        status:
          type: integer
          description: HTTP status code.
          example: 404
        error:
          type: string
          description: Short error type label.
          example: Not Found
        message:
          type: string
          description: Human-readable description of the error.
          example: Account with number 1000000001 not found.
        path:
          type: string
          description: Request path that caused the error.
          example: /accounts/1000000001
    ValidationError:
      type: object
      description: Error response for HTTP 400 request validation failures. Contains a
        list of field-level errors.
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred.
          example: 2024-01-15T10:30:00Z
        status:
          type: integer
          description: HTTP status code. Always 400 for validation errors.
          example: 400
        error:
          type: string
          description: Error type label.
          example: Bad Request
        message:
          type: string
          description: Summary message describing the validation failure.
          example: Request validation failed. Please check field errors.
        path:
          type: string
          description: Request path that caused the error.
          example: /accounts
        fieldErrors:
          type: array
          description: List of individual field-level validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Name of the field that failed validation.
                example: customerId
              message:
                type: string
                description: Validation failure reason for this field.
                example: customerId must be a valid existing customer ID
              rejectedValue:
                type: string
                description: The value that was rejected.
                example: "9999"
  examples:
    AccountCreateRequestSavingsExample:
      summary: Create SAVINGS account for customer 1001
      description: Standard savings account creation request for customer Surya Prakash.
      value:
        customerId: 1001
        accountType: SAVINGS
        currency: INR
        branch: Vizianagaram Main Branch
        ifsc: SBIN0001234
        nickname: My Savings Account
        initialDeposit: 10000
