kind: MCPTools
apiVersion: api.ibm.com/v1
metadata:
  name: banking-accounts-management-api-tool-tkqvk
  namespace: Banking-APIs
  version: "1.0"
  tags: []
  description: Accounts Management API for the Agentic Banking Platform. Manages
    the full lifecycle of bank accounts including creation, balance enquiry,
    transactions, and closure. Every account belongs to an existing customer
    identified by customerId. Integrates with Customer API, Payments API, Loan
    API, and Risk API. All services use customerId as the common identifier.
  labels:
    api-spec: ./banking-accounts-management-api-spec.yml
spec:
  tools:
    - name: createAccount
      description: Creates a new bank account for an existing customer. The
        accountNumber is auto-generated by the backend as a long numeric value
        starting from 1000000001. Every account must belong to a valid
        customerId between 1001 and 1020. Account types supported are SAVINGS,
        CURRENT, and FIXED_DEPOSIT. Default currency is INR. Default status is
        ACTIVE.
      inputSchema:
        type: object
        properties:
          customerId:
            type: integer
            format: int64
            description: Customer ID of the account owner. Must be a valid existing customer
              between 1001 and 1020.
            minimum: 1001
            example: 1001
          accountType:
            type: string
            description: Type of bank account. Allowed values are SAVINGS, CURRENT,
              FIXED_DEPOSIT.
            enum:
              - SAVINGS
              - CURRENT
              - FIXED_DEPOSIT
            example: SAVINGS
          currency:
            type: string
            description: Account currency. Defaults to INR. Maximum 3 characters ISO 4217
              currency code.
            default: INR
            maxLength: 3
            example: INR
          branch:
            type: string
            description: Branch name where the account is held. Maximum 100 characters.
            maxLength: 100
            example: Vizianagaram Main Branch
          ifsc:
            type: string
            description: IFSC code of the branch. 11-character alphanumeric code. First 4
              characters are bank code, 5th is 0, last 6 are branch code.
            pattern: ^[A-Z]{4}0[A-Z0-9]{6}$
            example: SBIN0001234
          nickname:
            type: string
            description: Optional friendly name for the account. Maximum 50 characters.
            maxLength: 50
            example: My Savings Account
          initialDeposit:
            type: number
            format: double
            description: Initial deposit amount in the account currency. Must be zero or
              greater.
            minimum: 0
            example: 10000
        required:
          - customerId
          - accountType
          - branch
          - ifsc
      title: Create a new account
      x-api-binding:
        operationPath: /accounts
        operationMethod: POST
        api:
          $path: ./banking-accounts-management-api-spec.yml
    - name: listAccounts
      description: >
        Returns a paginated list of account summaries.

        Supports optional filters for `customerId`, `accountType`, and `status`.


        **To retrieve all accounts for a specific customer**, pass `customerId`
        as a query parameter:


        ```

        GET /accounts?customerId=1001

        ```


        This is the correct backend route for customer-scoped account lookup.

        The path `/accounts/customer/{customerId}` does **not** exist on the
        backend and returns 404.


        Use `page` and `size` for pagination. Default page is 0 and default size
        is 20.
      inputSchema:
        type: object
        properties:
          page:
            description: Zero-based page number. Default is 0.
            x-parameter-location: query
            type: integer
            default: 0
            minimum: 0
          size:
            description: Number of records per page. Default is 20. Maximum is 100.
            x-parameter-location: query
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          customerId:
            description: >
              Filter accounts by customer ID. Must be a numeric value between
              1001 and 1020.

              Use this parameter to retrieve all accounts belonging to a
              specific customer.

              This is the backend-supported way to perform a customer-scoped
              account lookup.

              Example: GET /accounts?customerId=1001
            x-parameter-location: query
            type: integer
            format: int64
            minimum: 1001
          accountType:
            description: Filter accounts by account type. Allowed values are SAVINGS,
              CURRENT, FIXED_DEPOSIT.
            x-parameter-location: query
            type: string
            enum:
              - SAVINGS
              - CURRENT
              - FIXED_DEPOSIT
          status:
            description: Filter accounts by status. Allowed values are ACTIVE, INACTIVE,
              CLOSED.
            x-parameter-location: query
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - CLOSED
      title: List all accounts
      x-api-binding:
        operationPath: /accounts
        operationMethod: GET
        api:
          $path: ./banking-accounts-management-api-spec.yml
    - name: getAccount
      description: Returns the complete account profile for the given accountId. Range
        2001-2032 for seed data.
      inputSchema:
        type: object
        properties:
          accountId:
            description: Unique account identifier (integer, range 2001-2032 for seed data).
            x-parameter-location: path
            type: integer
        required:
          - accountId
      title: Get account by ID
      x-api-binding:
        operationPath: /accounts/{accountId}
        operationMethod: GET
        api:
          $path: ./banking-accounts-management-api-spec.yml
    - name: updateAccount
      description: Updates mutable fields of an existing account such as status,
        branch, and ifsc.
      inputSchema:
        type: object
        properties:
          accountId:
            description: Unique account identifier (integer, range 2001-2032 for seed data).
            x-parameter-location: path
            type: integer
          nickname:
            type: string
            description: Updated friendly name for the account. Maximum 50 characters.
            maxLength: 50
            example: My Updated Savings Account
          status:
            type: string
            description: Updated account status. Allowed values are ACTIVE, INACTIVE,
              CLOSED.
            enum:
              - ACTIVE
              - INACTIVE
              - CLOSED
            example: INACTIVE
          branch:
            type: string
            description: Updated branch name. Maximum 100 characters.
            maxLength: 100
            example: Hyderabad Central Branch
        required:
          - accountId
      title: Update account details
      x-api-binding:
        operationPath: /accounts/{accountId}
        operationMethod: PUT
        api:
          $path: ./banking-accounts-management-api-spec.yml
    - name: deleteAccount
      description: Deletes the account record from the backend.
      inputSchema:
        type: object
        properties:
          accountId:
            description: Unique account identifier (integer, range 2001-2032 for seed data).
            x-parameter-location: path
            type: integer
        required:
          - accountId
      title: Delete account
      x-api-binding:
        operationPath: /accounts/{accountId}
        operationMethod: DELETE
        api:
          $path: ./banking-accounts-management-api-spec.yml
    - name: getAccountsByCustomer
      description: |
        Returns all bank accounts belonging to the given `customerId`.
        A customer may have multiple accounts of different types.

        **Backend implementation note:** The backend does not expose a dedicated
        `/customers/{customerId}/accounts` or `/accounts/customer/{customerId}` sub-path.
        The backend route for this query is:

        ```
        GET /accounts?customerId={customerId}
        ```

        In IBM API Connect, the assembly for this operation must use an **Invoke** policy
        with the target URL rewritten to:

        ```
        https://accounts-service.2cdce5chee35.au-syd.codeengine.appdomain.cloud/accounts?customerId=$(request.parameters.customerId)
        ```

        Consumed by Loan API and Risk API to retrieve the full account portfolio of a customer.
      inputSchema:
        type: object
        properties:
          customerId:
            description: Unique numeric customer identifier. Must be between 1001 and 1020.
            x-parameter-location: path
            type: integer
            format: int64
            minimum: 1001
        required:
          - customerId
      title: Get all accounts for a customer
      x-api-binding:
        operationPath: /customers/{customerId}/accounts
        operationMethod: GET
        api:
          $path: ./banking-accounts-management-api-spec.yml
