      execute:
        - $ref: Loans-Service:InvokeWatsonxTextGen-d40hv:1.0
    - conditions:
        - verbPath:
            path: /tokenize
            verb: POST
      execute:
        - $ref: Loans-Service:InvokeWatsonxTokenize-d40hv:1.0
